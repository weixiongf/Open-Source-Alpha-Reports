name: 🙏 求分析
description: 想分析你的 GitHub 开源项目？按模板提交，我们将生成商业价值分析报告
title: "求分析：<项目名>"
labels: ["求分析"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交分析诉求！提交后我们会尽快安排分析，
        并生成《开源项目商业价值分析报告》（九维评分 + 一句话结论 + 完整报告页）。
  - type: textarea
    id: request
    attributes:
      label: 诉求
      description: 想分析什么？例如：商业化潜力、技术亮点、改进建议、竞品对比等
      placeholder: "请帮我分析下我的项目……"
    validations:
      required: true
  - type: input
    id: repo-url
    attributes:
      label: 项目链接
      description: GitHub 仓库地址
      placeholder: "https://github.com/owner/repo"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: 报告语言
      options:
        - 中文
        - English
      default: 0
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充说明（可选）
      description: 其他想让我们了解的信息：重点维度、注意事项、期望的分析角度等
