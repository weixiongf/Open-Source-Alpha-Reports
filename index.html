<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开源项目商业价值分析报告库</title><style>
:root{--blue:#2563eb;--ink:#0f172a;--dim:#64748b;--line:#e2e8f0;--bg:#f8fafc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Source Han Sans CN","思源黑体 CN","Noto Sans SC",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;padding:36px 16px 64px}
.wrap{max-width:1440px;margin:0 auto;width:100%}
/* 顶栏：标题 + 右上角仓库链接 */
.topbar{display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--blue);padding-bottom:10px}
h1{font-size:26px;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.topbar-links{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gh-link{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
  border-radius:8px;padding:7px 14px;font-size:13px;color:var(--ink);
  text-decoration:none;background:#fff;transition:all .15s;white-space:nowrap}
.gh-link:hover{border-color:var(--blue);color:var(--blue)}
.gh-link.wish{border-color:#fcd34d;background:#fffbeb;color:#92400e;font-weight:600}
.gh-link.wish:hover{border-color:#f59e0b;color:#b45309;background:#fef3c7}
.sub{color:var(--dim);margin:10px 0 20px;font-size:14px}
.badge{display:inline-block;background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;border-radius:14px;padding:5px 14px;font-size:13px}
/* 月份筛选工具栏（搜索框在左，月份筛选随后，整体左对齐） */
.toolbar{display:flex;align-items:center;justify-content:flex-start;
  gap:12px;margin:0 0 20px;flex-wrap:wrap}
.toolbar label{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:8px}
.toolbar select{padding:6px 12px;border:1px solid var(--line);border-radius:8px;
  background:#fff;color:var(--ink);font-size:13px;font-family:inherit;cursor:pointer}
.toolbar .hint{color:var(--dim);font-size:12px}
/* 搜索框 */
.search-box{padding:6px 12px;border:1px solid var(--line);border-radius:8px;
  background:#fff;color:var(--ink);font-size:13px;font-family:inherit;
  min-width:220px;flex:1;max-width:340px;outline:none;transition:border-color .15s}
.search-box:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
/* 搜索无结果提示 */
.no-result{background:#fff;border:1px dashed var(--line);border-radius:12px;
  padding:28px 20px;text-align:center;color:var(--dim);font-size:14px;line-height:2}
.no-result a{color:var(--blue);font-weight:700;text-decoration:none}
.no-result a:hover{text-decoration:underline}
.search-more{color:var(--dim);font-size:12.5px;margin-top:8px;text-align:center}
/* 月份分组卡片 */
.month-sec{margin-bottom:30px}
.month-title{display:flex;align-items:center;gap:10px;margin:0 0 10px;
  font-size:17px;font-weight:700;color:#1e3a8a}
.month-title::before{content:"";width:4px;height:18px;background:var(--blue);border-radius:2px}
.month-title .cnt{font-size:12px;color:var(--dim);font-weight:400}
table{width:100%;table-layout:fixed;border-collapse:collapse;background:#fff;
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
th{background:#eff6ff;color:#1e3a8a;text-align:left;padding:9px 12px;font-size:13px;
  white-space:nowrap}
td{padding:8px 12px;border-top:1px solid var(--line);font-size:13px;
  vertical-align:top}
tr:nth-child(even) td{background:#fbfdff}
/* 列宽：日期/项目/评分不换行，一句话结论可换行 */
th.c-date,td.c-date{width:92px;white-space:nowrap}
th.c-proj,td.c-proj{width:24%;white-space:nowrap}
th.c-score,td.c-score{width:88px;white-space:nowrap}
td.c-proj a{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.c-note{word-break:break-word}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.g{font-weight:700}
.g-S{color:#16a34a}.g-A{color:#2563eb}.g-B{color:#0891b2}
.g-C{color:#d97706}.g-D{color:#dc2626}
.foot{color:var(--dim);font-size:12px;margin-top:22px;border-top:1px dashed var(--line);
  padding-top:14px;text-align:center}
.credit{text-align:center;color:var(--dim);font-size:13px;margin-top:16px;
  letter-spacing:1px}
.credit a{color:var(--dim);text-decoration:none}
.credit a:hover{color:var(--blue);text-decoration:underline}
/* 月份快捷按钮 */
.month-btns{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.month-btn{border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;
  font-family:inherit;transition:all .15s}
.month-btn i{font-style:normal;color:var(--dim);margin-left:4px;font-size:11px}
.month-btn:hover{border-color:var(--blue);color:var(--blue)}
.month-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.month-btn.active i{color:rgba(255,255,255,.8)}
/* 80分以上按钮：金色高亮 */
.month-btn[data-m="high"]{border-color:#fcd34d;background:#fffbeb;color:#92400e;font-weight:600}
.month-btn[data-m="high"]:hover{border-color:#f59e0b;background:#fef3c7;color:#b45309}
.month-btn[data-m="high"].active{background:linear-gradient(135deg,#f59e0b,#d97706);
  border-color:#f59e0b;color:#fff}
.month-btn[data-m="high"].active i{color:rgba(255,255,255,.85)}
/* 排序表头 */
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:#dbeafe}
th .arrow{font-size:10px;margin-left:3px}
/* 滚动加载提示 */
.loading{text-align:center;color:var(--dim);font-size:13px;padding:18px 0}
/* 窄屏适配 */
@media (max-width:720px){
  th.c-date,td.c-date{width:76px}
  th.c-proj,td.c-proj{width:32%}
  th.c-score,td.c-score{width:70px}
  th,td{padding:8px 8px}
  h1{font-size:22px}
}
</style></head><body><div class="wrap"><div class="topbar"><h1>开源项目商业价值分析报告库<span class="badge">119 份</span></h1><div class="topbar-links"><a class="gh-link" href="https://github.com/weixiongf/Open-Source-Alpha-Reports" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>GitHub 仓库 ↗</a><a class="gh-link wish" href="https://github.com/weixiongf/Open-Source-Alpha-Reports/issues" target="_blank" rel="noopener">🙏 求分析 ↗</a></div></div><div class="sub">以商业价值为第一视角的 GitHub 开源项目深度分析档案 · 每日自动更新 · 分析仅反映数据快照时点，项目后续变化与报告不一致属正常现象</div><div class="toolbar" id="toolbar"><input id="search-box" class="search-box" type="search" placeholder="搜索项目名 / 日期 / 结论" oninput="onSearch(this.value)"><label>月份筛选：<select id="month-select" onchange="pickMonth(this.value)"></select></label><span class="hint">共 3 个月 · 点项目名直达报告页 · 点表头可排序</span></div><div class="month-btns" id="month-btns"></div><div id="list"></div><div class="loading" id="loader"></div><div class="foot">本页面由 @向量之心 打造的 github_anyliasis 系统自动维护。报告为 AI 辅助生成的第三方独立分析，仅供研究参考，不构成投资建议。</div><div class="credit">@魔法工厂 @向量之心 @南山科学家 @冯伟雄 · <a href="https://www.mova.work">www.mova.work</a></div></div><script>
var MONTHS=[["2026-09", 76], ["2026-08", 41], ["2026-07", 2]];
var TOTAL=119;
var HIGH_COUNT=12;
var cur='all';
var sortKey='date',sortAsc=false;
var cache={};
var highCache=null;
var mode='months';
var loadN=3;
var searchMode=false,lastQuery='',searchTimer=null;
var sel=document.getElementById('month-select');
sel.add(new Option('全部月份（'+TOTAL+' 份）','all'));
MONTHS.forEach(function(m){sel.add(new Option(m[0]+'（'+m[1]+' 份）',m[0]));});
var btnsBox=document.getElementById('month-btns');
var bAll=document.createElement('button');
bAll.className='month-btn';bAll.dataset.m='all';
bAll.innerHTML='全部 <i>'+TOTAL+'</i>';
bAll.onclick=function(){pickMonth('all');};
btnsBox.appendChild(bAll);
var bHigh=document.createElement('button');
bHigh.className='month-btn';bHigh.dataset.m='high';
bHigh.innerHTML='⭐ 80分以上 <i>'+HIGH_COUNT+'</i>';
bHigh.onclick=function(){if(mode==='months'){enterHigh();}};
btnsBox.appendChild(bHigh);
MONTHS.slice(0,12).forEach(function(m){
  var b=document.createElement('button');
  b.className='month-btn';b.dataset.m=m[0];
  b.innerHTML=m[0]+' <i>'+m[1]+'</i>';
  b.onclick=function(){pickMonth(m[0]);};
  btnsBox.appendChild(b);
});
var list=document.getElementById('list');
var loader=document.getElementById('loader');
function pickMonth(m){
  if(mode==='high'){mode='months';}
  searchMode=false;lastQuery='';
  var sb=document.getElementById('search-box');
  if(sb){sb.value='';}
  cur=m;sel.value=m;
  var bs=btnsBox.children;
  for(var i=0;i<bs.length;i++){bs[i].classList.toggle('active',bs[i].dataset.m===m);}
  list.innerHTML='';
  visibleMonths().forEach(function(x){if(!cache[x]){fetchMonth(x);}});
  redraw();
  updateLoader();
}
/* --- 视图切换：全部报告（月份） / 80分以上（独立数据） --- */
function enterHigh(){
  mode='high';
  var bs=btnsBox.children;
  for(var i=0;i<bs.length;i++){bs[i].classList.toggle('active',bs[i].dataset.m==='high');}
  searchMode=false;lastQuery='';
  var sb=document.getElementById('search-box');
  if(sb){sb.value='';}
  list.innerHTML='';
  if(highCache===null){
    loader.style.display='block';
    loader.textContent='正在加载 80 分以上项目…';
    fetch('data/high_score.json').then(function(r){return r.json();})
      .then(function(rows){highCache=rows;renderHigh();})
      .catch(function(){highCache=[];renderHigh();});
  }else{renderHigh();}
}
function exitHigh(){
  mode='months';
  pickMonth(cur);
}
function renderHigh(){
  loader.style.display='none';
  var rows=(highCache||[]).slice().sort(sortFn(sortKey));
  list.innerHTML='';
  if(!rows.length){
    list.innerHTML='<div class="no-result">暂无 80 分以上的项目（S 级）。</div>';
    return;
  }
  var sec=document.createElement('section');
  sec.className='month-sec';
  var h='<div class="month-title">⭐ 80 分以上项目'+
    '<span class="cnt">'+rows.length+' 个 · 按历史最高分（S 级）</span></div>'+
    '<table><thead><tr>'+th('date','分析日期')+th('proj','项目')+th('score','评分')+
    th('','一句话结论')+'</tr></thead><tbody>';
  rows.forEach(function(r){h+=rowHtml(r);});
  h+='</tbody></table>';
  sec.innerHTML=h;
  list.appendChild(sec);
  window.scrollTo(0,0);
}
function visibleMonths(){
  if(cur==='all'){return MONTHS.slice(0,loadN).map(function(x){return x[0];});}
  return [cur];
}
function fetchMonth(m,cb){
  fetch('data/reports_'+m+'.json').then(function(r){return r.json();})
  .then(function(rows){
    cache[m]=rows;
    if(cb){cb();}
    else if(!searchMode&&visibleMonths().indexOf(m)>=0){redraw();}
  })
  .catch(function(){
    cache[m]=[];
    if(cb){cb();}
    else if(!searchMode&&visibleMonths().indexOf(m)>=0){redraw();}
  });
}
function sortFn(k){
  if(k==='date'){
    return sortAsc?function(a,b){return a.d<b.d?-1:(a.d>b.d?1:0);}
                 :function(a,b){return a.d>b.d?-1:(a.d<b.d?1:0);};
  }
  if(k==='score'){
    return sortAsc?function(a,b){return (Number(a.s)||0)-(Number(b.s)||0);}
                 :function(a,b){return (Number(b.s)||0)-(Number(a.s)||0);};
  }
  return sortAsc?function(a,b){return a.p.localeCompare(b.p);}
               :function(a,b){return b.p.localeCompare(a.p);};
}
function th(k,label){
  var arrow=sortKey===k?(sortAsc?' ▲':' ▼'):'';
  var cls=k?('sortable c-'+k):'c-note';
  return '<th class="'+cls+'"'+(k?' data-sort="'+k+'"':'')+'>'+label+
         '<span class="arrow">'+arrow+'</span></th>';
}
function rowHtml(r){
  var link=r.h?'<a href="'+r.h+'" title="'+r.p+'">'+r.p+'</a>':r.p;
  return '<tr><td class="c-date">'+r.d+'</td><td class="c-proj">'+link+'</td>'+
    '<td class="c-score g g-'+r.g+'">'+r.g+' · '+r.s+'</td>'+
    '<td class="c-note">'+r.o+'</td></tr>';
}
function renderMonth(m){
  var sec=document.createElement('section');
  sec.className='month-sec';sec.dataset.m=m;
  var rows=cache[m].slice().sort(sortFn(sortKey));
  var h='<div class="month-title">'+m+'<span class="cnt">'+rows.length+' 份报告</span></div>'+
    '<table><thead><tr>'+th('date','日期')+th('proj','项目')+th('score','评分')+th('','一句话结论')+'</tr></thead><tbody>';
  rows.forEach(function(r){h+=rowHtml(r);});
  h+='</tbody></table>';
  sec.innerHTML=h;
  var idx=MONTHS.findIndex(function(x){return x[0]===m;});
  var after=null;
  for(var j=idx+1;j<MONTHS.length;j++){
    var e=list.querySelector('[data-m="'+MONTHS[j][0]+'"]');
    if(e){after=e;break;}
  }
  if(after){list.insertBefore(sec,after);}else{list.appendChild(sec);}
}
function redraw(){
  var sy=window.scrollY;
  if(mode==='high'){renderHigh();return;}
  if(searchMode&&lastQuery){renderSearch(lastQuery,true);window.scrollTo(0,sy);return;}
  list.innerHTML='';
  visibleMonths().forEach(function(m){if(cache[m]){renderMonth(m);}});
  window.scrollTo(0,sy);
}
function esc(s){
  var d=document.createElement('div');d.textContent=s;return d.innerHTML;
}
function onSearch(v){
  v=v.trim();
  clearTimeout(searchTimer);
  if(mode==='high'){exitHigh();}
  if(!v){
    searchMode=false;lastQuery='';
    pickMonth(cur);
    return;
  }
  loader.style.display='block';
  loader.textContent='正在搜索…';
  searchTimer=setTimeout(function(){doSearch(v);},300);
}
function doSearch(q){
  ensureAll(function(){renderSearch(q,true);});
}
function ensureAll(cb){
  var missing=[];
  MONTHS.forEach(function(m){if(!cache[m[0]]){missing.push(m[0]);}});
  if(!missing.length){cb();return;}
  var done=0;
  loader.style.display='block';
  loader.textContent='正在加载全部数据 0/'+missing.length+' 个月…';
  missing.forEach(function(m){
    fetchMonth(m,function(){
      done++;
      loader.textContent='正在加载全部数据 '+done+'/'+missing.length+' 个月…';
      if(done===missing.length){loader.style.display='none';cb();}
    });
  });
}
function renderSearch(q,dataReady){
  if(!dataReady){ensureAll(function(){renderSearch(q,true);});return;}
  searchMode=true;lastQuery=q;
  var ql=q.toLowerCase();
  var res=[];
  MONTHS.forEach(function(m){
    (cache[m[0]]||[]).forEach(function(r){
      if(r.d.toLowerCase().indexOf(ql)>=0||
         r.p.toLowerCase().indexOf(ql)>=0||
         r.o.toLowerCase().indexOf(ql)>=0){res.push(r);}
    });
  });
  var sy=window.scrollY;
  list.innerHTML='';
  if(!res.length){
    list.innerHTML='<div class="no-result">没有找到与「'+esc(q)+'」相关的报告。<br>'+
      '想要哪个项目？欢迎到 GitHub 仓库提 issue，我们会优先分析：<br>'+
      '<a href="https://github.com/weixiongf/Open-Source-Alpha-Reports/issues" '+
      'target="_blank" rel="noopener">提交 Issue ↗</a></div>';
  }else{
    var max=300;
    res.sort(sortFn(sortKey));
    var rows=res.slice(0,max);
    var sec=document.createElement('section');
    sec.className='month-sec';
    var h='<div class="month-title">搜索「'+esc(q)+'」'+
      '<span class="cnt">'+res.length+' 条结果</span></div>'+
      '<table><thead><tr>'+th('date','日期')+th('proj','项目')+th('score','评分')+
      th('','一句话结论')+'</tr></thead><tbody>';
    rows.forEach(function(r){h+=rowHtml(r);});
    h+='</tbody></table>';
    if(res.length>max){
      h+='<div class="search-more">结果过多，仅显示前 '+max+' 条，请细化关键词</div>';
    }
    sec.innerHTML=h;
    list.appendChild(sec);
  }
  window.scrollTo(0,sy);
  updateLoader();
}
list.addEventListener('click',function(ev){
  var t=ev.target.closest('th.sortable');
  if(!t){return;}
  var k=t.getAttribute('data-sort');
  if(sortKey===k){sortAsc=!sortAsc;}else{sortKey=k;sortAsc=true;}
  redraw();
});
var io=new IntersectionObserver(function(es){
  es.forEach(function(en){
    if(en.isIntersecting&&mode==='months'&&!searchMode&&cur==='all'&&loadN<MONTHS.length){
      var add=Math.min(3,MONTHS.length-loadN);
      for(var i=0;i<add;i++){
        var m=MONTHS[loadN+i][0];
        if(!cache[m]){fetchMonth(m);}
      }
      loadN+=add;updateLoader();
    }
  });
},{rootMargin:'300px'});
io.observe(loader);
function updateLoader(){
  if(mode==='high'||searchMode){loader.style.display='none';return;}
  if(cur==='all'&&loadN<MONTHS.length){
    loader.style.display='block';
    loader.textContent='已加载 '+Math.min(loadN,MONTHS.length)+'/'+MONTHS.length+' 个月 · 继续滚动加载更多…';
  }else{loader.style.display='none';}
}
pickMonth('all');
</script></body></html>
